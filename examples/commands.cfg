{
  "version": 2,
  "router": {
    "usbDevToMidiIo": true,
    "usbDevToUsbHost": true,
    "usbDevToMidiControl": true,
    "midiIoToUsbDev": true,
    "midiIoToUsbHost": true,
    "usbHostToMidiIo": true,
    "usbHostToUsbDev": true,
    "midiIo1Thru": false,
    "midiIo2Thru": false,
    "midiControlPort": 2,
    "midiControlChannel": 0,
    "midiControlDrop": true
  },
  "hardware": {
    "buttons": {
      "rightTop": { "primary": "openPresetMenu", "knobTouch": "openDetail" }
    }
  },
  "midiControl": [
    { "midiMessage": "cc7", "parameterNumber": 110, "command": { "type": "openPresetMenu" } },
    { "midiMessage": "cc7", "parameterNumber": 111, "command": { "type": "closePopupWindow" } },
    { "midiMessage": "cc7", "parameterNumber": 112, "command": { "type": "switchPage", "parameter": 2 } },
    { "midiMessage": "cc7", "parameterNumber": 113, "command": { "type": "switchPage", "parameter": 1 } },
    { "midiMessage": "cc7", "parameterNumber": 114, "command": { "type": "switchControlSetNext" } },
    { "midiMessage": "cc7", "parameterNumber": 115, "command": { "type": "setAllDefaultValues" } },
    { "midiMessage": "cc7", "parameterNumber": 116, "command": { "type": "runUserFunction", "parameter": 1 } },
    { "midiMessage": "cc7", "parameterNumber": 117, "event": "switchPageNext" }
  ],
  "uiFeatures": {
    "touchSwitchControlSets": true,
    "resetActiveControlSet": false,
    "activeControlSetType": "dim",
    "keepPresetState": true,
    "loadPresetStateOnStartup": false
  }
}
